name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # GitHub's Ubuntu runners have Google Chrome installed; the tests drive it headless
      - run: npm test
        env:
          BROWSER_CHANNEL: chrome

      # On failure, keep the screenshots so you can see what the page looked like
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-screenshots
          path: tests/output/
